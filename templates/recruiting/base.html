<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}KARRIERE{% endblock %} | HAMMEL</title><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/cinematic-unified.css"><link rel="stylesheet" href="/assets/css/cinematic-margins.css"><link rel="stylesheet" href="/assets/css/navigation-2026.css"><link rel="stylesheet" href="/assets/css/footer-unified.css"><link rel="stylesheet" href="/assets/css/page-hero.css"><link rel="stylesheet" href="/assets/css/cinematic-cta.css"><link rel="stylesheet" href="/assets/css/recruiting.css?v=apply-home-single-line-20261023-3"><style id="hr-accordion-critical-layout">/* Accessible expandable Ausbildung positions */
.hr-openings--editorial .hr-editorial-accordion{border-bottom:1px solid #c8c8c5}
.hr-openings--editorial .hr-editorial-accordion__trigger{
  cursor:pointer;list-style:none;border-bottom:0!important;user-select:none
}
.hr-openings--editorial .hr-editorial-accordion__trigger::-webkit-details-marker{display:none}
.hr-openings--editorial .hr-editorial-accordion__trigger::marker{content:""}
.hr-openings--editorial .hr-editorial-accordion__trigger:focus-visible{outline:2px solid #e30613;outline-offset:-2px}
.hr-openings--editorial .hr-editorial-accordion__title{
  display:block;margin:0 0 14px;font-size:clamp(22px,2.5vw,37px);
  font-weight:800;line-height:1.18;letter-spacing:-.02em;overflow-wrap:anywhere
}
.hr-openings--editorial .hr-editorial-accordion__meta{display:block;color:#62676b;font-size:15px;line-height:1.5}
.hr-openings--editorial .hr-editorial-accordion__toggle{
  display:flex;align-items:center;justify-content:flex-end;gap:18px;
  font-size:12px;font-weight:800;letter-spacing:.07em;color:#171a1c;text-align:right
}
.hr-openings--editorial .hr-editorial-accordion__plus{
  width:36px;height:36px;border:1px solid #e30613;border-radius:50%;
  position:relative;flex-shrink:0;transition:background .25s ease,transform .25s ease
}
.hr-openings--editorial .hr-editorial-accordion__plus:before,
.hr-openings--editorial .hr-editorial-accordion__plus:after{
  content:"";position:absolute;background:#171a1c;top:50%;left:50%;transform:translate(-50%,-50%);transition:transform .25s ease,background .25s ease
}
.hr-openings--editorial .hr-editorial-accordion__plus:before{width:12px;height:1.5px}
.hr-openings--editorial .hr-editorial-accordion__plus:after{height:12px;width:1.5px}
.hr-openings--editorial .hr-editorial-accordion[open] .hr-editorial-accordion__plus:after{transform:translate(-50%,-50%) rotate(90deg)}
.hr-openings--editorial .hr-editorial-accordion[open] .hr-editorial-accordion__plus,
.hr-openings--editorial .hr-editorial-accordion__trigger:hover .hr-editorial-accordion__plus{background:#e30613}
.hr-openings--editorial .hr-editorial-accordion[open] .hr-editorial-accordion__plus:before,
.hr-openings--editorial .hr-editorial-accordion[open] .hr-editorial-accordion__plus:after,
.hr-openings--editorial .hr-editorial-accordion__trigger:hover .hr-editorial-accordion__plus:before,
.hr-openings--editorial .hr-editorial-accordion__trigger:hover .hr-editorial-accordion__plus:after{background:white}
.hr-openings--editorial .hr-editorial-accordion__panel{overflow:hidden;animation:hr-reveal .32s ease both}
@keyframes hr-reveal{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:translateY(0)}}
.hr-openings--editorial .hr-editorial-accordion__content{
  padding:0 0 clamp(30px,4vw,58px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 56px
}
.hr-openings--editorial .hr-editorial-accordion__section h5{font-size:13px;letter-spacing:.1em;color:#e30613;margin:0 0 12px;font-weight:800}
.hr-openings--editorial .hr-editorial-accordion__section p{margin:0;color:#555d60;font-size:16px;line-height:1.75}
.hr-openings--editorial .hr-editorial-accordion__disclaimer{grid-column:1/-1;border-top:1px solid #d4d4d1;padding-top:20px;color:#6a6e70;font-size:13px;line-height:1.65;margin:0}
@media(max-width:760px){
 .hr-openings--editorial .hr-editorial-accordion__toggle{justify-content:flex-start;text-align:left}
 .hr-openings--editorial .hr-editorial-accordion__content{grid-template-columns:1fr;gap:24px}
}
@media(prefers-reduced-motion:reduce){.hr-openings--editorial .hr-editorial-accordion__panel{animation:none}}

.hr-openings--editorial details.hr-editorial-accordion{display:block!important;width:100%;margin:0;padding:0}
.hr-openings--editorial details.hr-editorial-accordion > summary.hr-editorial-accordion__trigger{
 display:grid!important;grid-template-columns:minmax(0,1fr) minmax(190px,27%)!important;
 align-items:center!important;column-gap:40px!important;
 padding:34px 0!important;margin:0!important;min-height:0!important;
 border:0!important;list-style:none!important;background:transparent!important;
}
.hr-openings--editorial details.hr-editorial-accordion > summary.hr-editorial-accordion__trigger::marker{content:""!important}
.hr-openings--editorial details.hr-editorial-accordion > summary.hr-editorial-accordion__trigger::-webkit-details-marker{display:none!important}
.hr-openings--editorial .hr-editorial-accordion__trigger .hr-editorial-item__body{display:block!important;min-width:0!important}
.hr-openings--editorial .hr-editorial-accordion__trigger .hr-editorial-accordion__title{
 display:block!important;font-size:clamp(23px,2.5vw,40px)!important;
 font-weight:800!important;line-height:1.16!important;margin:0 0 14px!important;
 color:#171a1c!important;text-transform:uppercase!important;
}
.hr-openings--editorial .hr-editorial-accordion__trigger .hr-editorial-accordion__meta{
 display:block!important;font-size:15px!important;color:#666!important
}
.hr-openings--editorial .hr-editorial-accordion__trigger .hr-editorial-accordion__toggle{
 display:flex!important;justify-content:flex-end!important;align-items:center!important;
 gap:18px!important;white-space:normal!important
}
@media(max-width:760px){
 .hr-openings--editorial details.hr-editorial-accordion > summary.hr-editorial-accordion__trigger{
  grid-template-columns:minmax(0,1fr)!important;row-gap:18px!important
 }
 .hr-openings--editorial .hr-editorial-accordion__trigger .hr-editorial-accordion__toggle{justify-content:flex-start!important}
}
